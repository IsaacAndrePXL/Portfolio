<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>DishDash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="Homepage.html" class="logo-link">
        <div class="logo-box">
            <img class="logo-img" src="Logos/DishDashLogo.png" alt="Logo">
        </div>
        <div class="logo-text">
            <span class="dishdash">DishDash</span>
            <span class="slogan">Italiaanse take-away</span>
        </div>
    </a>

    <a href="Checkout.html">
        <button class="cart" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 class="cart-icon" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="21" r="1"/>
                <circle cx="19" cy="21" r="1"/>
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
            </svg>
            Winkelmandje
        </button>
    </a>
    <a href="../../index.html#projecten" class="universal-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#3e3c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 21.0001V15.0001H10V21.0001M19 9.77818V16.2001C19 17.8802 19 18.7203 18.673 19.362C18.3854 19.9265 17.9265 20.3855 17.362 20.6731C16.7202 21.0001 15.8802 21.0001 14.2 21.0001H9.8C8.11984 21.0001 7.27976 21.0001 6.63803 20.6731C6.07354 20.3855 5.6146 19.9265 5.32698 19.362C5 18.7203 5 17.8802 5 16.2001V9.77753M21 12.0001L15.5668 5.96405C14.3311 4.59129 13.7133 3.9049 12.9856 3.65151C12.3466 3.42894 11.651 3.42899 11.0119 3.65165C10.2843 3.90516 9.66661 4.59163 8.43114 5.96458L3 12.0001" stroke="#3e3c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
</header>

<section class="promo-day" id="hero-section">
    <div class="promo-image">
        <img src="" alt="" id="hero-image">
    </div>

    <div class="promo-content">
       <span class="promo-badge">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               class="promo-icon" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>
          </svg>
          Gerecht van de dag
       </span>

        <h1 id="hero-name">Effe wachten...</h1>
        <p id="hero-ingredients"></p>

        <div class="promo-tags" id="hero-tags"></div>

        <div class="promo-price-action">
            <span class="promo-price" id="hero-price"></span>
            <button class="btn-add-hero" id="hero-add">+ Toevoegen</button>
        </div>
    </div>
</section>

<div class="filter-bar-wrapper">
    <div class="filter-bar">
        <div class="filter-buttons">
            <button class="filter-button active">
                Alles
            </button>

            <button class="filter-button">
                <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
                Vegetarisch
            </button>

            <button class="filter-button">
                <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     fill="currentColor" width="22" height="22">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                          d="M16.774 5.694c-.038-.089-.077-.134-.205-.262a.75.75 0 1 0-1.06 1.06l.53.531-1.645 1.645a3.7 3.7 0 0 1 1.06 1.06L17.1 8.085l.53.53a.75.75 0 1 0 1.061-1.06c-.128-.128-.173-.168-.262-.206-.104-.045-.324-.105-.799-.105h-.75v-.75c0-.475-.06-.695-.105-.799m-.704 5.54c.21.97.154 2.03-.046 3.008-.367 1.796-1.264 3.606-2.348 4.69-2.243 2.242-5.935 2.067-8.244-.242s-2.484-6-.241-8.244C6.275 9.362 8.084 8.465 9.88 8.098c.979-.2 2.037-.256 3.008-.046l1.12-1.12a2.251 2.251 0 0 1 3.632-2.55c.139.138.357.356.513.722.085.199.146.423.182.683.26.037.485.097.684.182a2.2 2.2 0 0 1 .732.524 2.25 2.25 0 0 1-2.561 3.621zm-5.89-1.666c-1.573.32-3.095 1.105-3.929 1.939-1.59 1.591-1.55 4.331.242 6.123 1.791 1.791 4.531 1.832 6.123.24.833-.833 1.617-2.355 1.938-3.927.327-1.6.124-2.977-.637-3.738s-2.137-.963-3.737-.637"/>
                </svg>
                Met vlees/vis
            </button>
        </div>

        <div class="filter-right">
            <span id="total-items">0 gerechten</span>
            <label for="sort-select"></label>
            <select id="sort-select" class="sort-select">
                <option value="Standaard">Alles</option>
                <option value="Prijs oplopend">Prijs oplopend</option>
                <option value="Prijs aflopend">Prijs aflopend</option>
            </select>
        </div>
    </div>
</div>

<h2 class="title">Pizza</h2>
<div class="menu-grid" id="pizza"></div>

<h2 class="title">Pasta</h2>
<div class="menu-grid" id="pasta"></div>

<h2 class="title">Salad</h2>
<div class="menu-grid" id="salad"></div>

<h2 class="title">Drinks</h2>
<div class="menu-grid" id="drinks"></div>

<h2 class="title">Dessert</h2>
<div class="menu-grid" id="dessert"></div>

<footer>
    DishDash
    &copy; 2025 - Alle rechten voorbehouden.
</footer>

<script src="menu.js"></script>
<script src="index.js"></script>
</body>
</html>
